# live-configs/fleet.yaml — declarative fleet manifest
#
# Each enabled combination runs as execution-engine@<id>.service on the server.
# One Docker container per combination, one strategy per container.
#
# id format:    <strategy>-<exchange>  (e.g. strategy_3a-bybit)
# Metrics port: 9500–9599 (unique per combination)
# Health port:  9600–9699 (unique per combination, no overlap with metrics)
#
# Operator workflow:
#   1. Edit this file (and/or live-configs/strategies/<id>.yaml)
#   2. Open PR, review, merge
#   3. npm run fleet:generate-configs   # generate per-instance config files
#   4. npm run fleet:reconcile          # diff vs server state and apply

combinations:
  - id: strategy_1-binance
    strategy: strategy_1
    exchange: binance
    enabled: true
    strategy_config: live-configs/strategies/strategy_1-binance.yaml
    runtime:
      metrics_port: 9500
      health_port: 9600
      log_level: info
    risk:
      maxConcurrentIntents: 200
      maxNotionalUsd: 50000

  - id: strategy_1_ws-binance
