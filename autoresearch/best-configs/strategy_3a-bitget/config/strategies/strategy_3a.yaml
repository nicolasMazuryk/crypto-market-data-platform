# Strategy 3A: Negative Funding SHORT - Ride the Drop (TP = F * 1.5)
# Short to profit from the price drop, TP variant A

strategy_id: "strategy_3a"
direction: "short"
funding_threshold: 0.015      # 1.50%
entry_offset_seconds: 5       # Enter at T_funding - 5s
stop_loss: 0.0115            # 1.15%
tp_mode: "A"
tp_multiplier: 1.975          # TP = F * 1.975
tp_addend: 0.003              # Not used in mode A, but required
deadline_seconds: 60          # Max seconds after T_funding before forced exit
funding_applied_on_same_second: true
