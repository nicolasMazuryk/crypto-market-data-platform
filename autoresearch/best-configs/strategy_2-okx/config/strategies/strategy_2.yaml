# Strategy 2: Negative Funding LONG - Retracement Exit
# Hold long, wait for partial price retracement after the drop

strategy_id: 'strategy_2'
direction: 'long'
funding_threshold: 0.015 # 1.5%
entry_offset_seconds: 2 # Enter at T_funding - 5s
retracement_pct: 1.4 # 140% retracement target
deadline_seconds: 600 # Max hold after T_funding (10 minutes)
sl_mult: 4.0 # SL at entry × (1 − F × 4.0)
funding_applied_on_same_second: false
