# Strategy 3A: Negative Funding SHORT - Ride the Drop (TP = F * mult)
# Short to profit from the price drop, TP variant A

strategy_id: 'strategy_3a'
direction: 'short'
negative_funding_threshold_percent: -1.5
entry_offset_seconds: 3 # Enter at T_funding - 3s (clamped to new >=3 bound)
stop_loss_percent: 2.6
tp_mode: 'A'
tp_multiplier: 1.2 # TP = F * 1.2
tp_addend_pct: 0.30 # Not used in mode A, but required
deadline_seconds: 60
amount_usd: 20
leverage: 4
