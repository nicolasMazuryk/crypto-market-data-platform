# Strategy 3B: Negative Funding SHORT - Ride the Drop (TP = F + 0.4%)
# Short to profit from the price drop, TP variant B

strategy_id: 'strategy_3b'
direction: 'short'
funding_threshold: 0.015 # 1.20%
entry_offset_seconds: 2 # Enter at T_funding - 2s
stop_loss: 0.0255 # 2.55%
tp_mode: 'B'
tp_multiplier: 1.5 # Not used in mode B, but required
tp_addend_pct: 1.60 # TP = F + 1.60%
deadline_seconds: 300 # Max seconds after T_funding before forced exit
funding_applied_on_same_second: true
