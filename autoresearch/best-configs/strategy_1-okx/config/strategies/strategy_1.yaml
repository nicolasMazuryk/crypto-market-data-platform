# Strategy 1: Negative Funding LONG - Instant Exit
# Collect funding fee, immediately exit to minimize delta exposure

strategy_id: "strategy_1"
direction: "long"
funding_threshold: 0.0075      # 0.75%
entry_offset_seconds: 3       # Enter at T_funding - 3s
exit_offset_seconds: 2        # Exit at T_funding + 2s
funding_applied_on_same_second: false
