# Strategy 2: Negative Funding LONG - Retracement Exit
# Hold long, wait for partial price retracement after the drop

strategy_id: 'strategy_2'
direction: 'long'
negative_funding_threshold_percent: -2.0 # -2.0%
entry_offset_seconds: 3 # Enter at T_funding - 3s (clamped to new >=3 bound)
retracement_pct: 0.35 # 35% retracement target
deadline_seconds: 600 # Max hold after T_funding (10 minutes)
sl_multiplier: 2.5 # SL at entry × (1 − F × 1.3)
amount_usd: 20
leverage: 4
