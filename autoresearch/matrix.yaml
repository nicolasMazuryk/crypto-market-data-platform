# autoresearch run matrix
#
# Each entry is a (strategy, exchange[-pair]) tuple the orchestrator will
# iteratively tune. Tags are derived:
#   - non-cross-exchange: <strategy>-<exchange>
#   - strategy_5        : strategy_5-<exchange_a>_<exchange_b>
#
# Per-row fields:
#   agent: claude | codex   (default: claude) — which coding agent drives the propose step
#
# Settings applied to every row unless overridden by a per-row field.
default_iterations: 3
max_parallel: 4            # concurrent runs
max_parallel_backtests: 4  # concurrent ClickHouse-hitting backtests
iteration_timeout_ms: 600000
backtest_timeout_ms: 600000
per_iteration_budget_usd: 0.50

runs:
  - strategy: strategy_1
    exchange: binance
    agent: codex
  - strategy: strategy_2
    exchange: binance
    agent: codex
  - strategy: strategy_3a
    exchange: binance
    agent: codex
  - strategy: strategy_3b
    exchange: binance
    agent: codex
  - strategy: strategy_4_1a
    exchange: binance
    agent: codex
  - strategy: strategy_4_1b
    exchange: binance
    agent: codex
  - strategy: strategy_4_2a
    exchange: binance
    agent: codex
  - strategy: strategy_4_2b
    exchange: binance
    agent: codex
  - strategy: strategy_4_3a
    exchange: binance
    agent: codex
  - strategy: strategy_4_3b
    exchange: binance
    agent: codex
  # - strategy: strategy_5
  #   exchange_a: binance
  #   exchange_b: bybit
  #   agent: codex
