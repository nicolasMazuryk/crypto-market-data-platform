# autoresearch run matrix
#
# Each entry is a (strategy, exchange) tuple the orchestrator will
# iteratively tune. Tags are derived as <strategy>-<exchange>.
#
# Per-row fields:
#   agent: claude | claude   (default: claude) — which coding agent drives the propose step
#
# Settings applied to every row unless overridden by a per-row field.
default_iterations: 40
max_parallel: 2 # concurrent runs
max_parallel_backtests: 1 # concurrent ClickHouse-hitting backtests (1 = serialized pre-fetches avoid SSH tunnel overload)
iteration_timeout_ms: 600000
backtest_timeout_ms: 600000
per_iteration_budget_usd: 0.75

runs:
  # strategy_1
  # - strategy: strategy_1
  #   exchange: bitget
  #   agent: claude

  # strategy_1_ws
  # - strategy: strategy_1_ws
  #   exchange: bitget
  #   agent: claude

  # strategy_2
  # - strategy: strategy_2
  #   exchange: binance
  #   agent: claude
  # - strategy: strategy_2
  #   exchange: okx
  #   agent: claude
  - strategy: strategy_2
    exchange: bitget
    agent: claude
  # - strategy: strategy_2
  #   exchange: kucoin
  #   agent: claude

  # strategy_3a
  # - strategy: strategy_3a
  #   exchange: binance
  #   agent: claude

  # strategy_4_1a
  # - strategy: strategy_4_1a
  #   exchange: binance
  #   agent: claude
  # - strategy: strategy_4_1a
  #   exchange: okx
  #   agent: claude
  # - strategy: strategy_4_1a
  #   exchange: bitget
  #   agent: claude

  # strategy_4_2a
  # - strategy: strategy_4_2a
  #   exchange: binance
  #   agent: claude
  # - strategy: strategy_4_2a
  #   exchange: okx
  #   agent: claude
  - strategy: strategy_4_2a
    exchange: bitget
    agent: claude
