app_name: arbinet
app_dir: /opt/arbinet
repo_dir: /opt/arbinet/repo
repo_url: 'git@github.com:nicolasMazuryk/crypto-market-data-platform.git'
repo_branch: main

data_dir: /data
clickhouse_data_dir: /data/clickhouse
postgres_data_dir: /data/postgres
postgres_backup_dir: /data/backups/postgres
quotes_validation_reports_dir: /data/reports/quotes-validation

timezone: Europe/Warsaw

# ClickHouse
clickhouse_image: clickhouse/clickhouse-server:25.5.6
clickhouse_http_port: 8123
clickhouse_native_port: 9000
clickhouse_database: arbinet
clickhouse_user: arbinet
clickhouse_password: "{{ lookup('env', 'CLICKHOUSE_PASSWORD') }}"

# PostgreSQL
postgres_image: postgres:18-alpine
postgres_port: 5432
postgres_db: arbinet
postgres_user: arbinet
postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"

# Sync data window
sync_data_period_start: 2025-01-01T00:00:00Z
sync_data_period_end:

# Funding download tasks
funding_download_tasks_date_range_start: 2026-04-16
funding_download_tasks_date_range_end: 2026-07-26
funding_download_tasks_threshold: -0.003
funding_download_tasks_dry_run: false
funding_download_tasks_excluded_exchanges: mexc

# Backtest coverage audit
audit_date_range_start: 2026-04-16
audit_date_range_end: 2026-07-26

# Worker schedules (systemd OnCalendar format)
market_sync_schedule: '*-*-* *:00:00'
funding_rates_schedule: '*-*-* *:05:00'
health_check_schedule: '*-*-* *:00/3:00'

# Docker
docker_compose_file: /opt/arbinet/docker-compose.prod.yml

# Quote sync horizontal scaling
quotes_sync_worker_count: 3
quotes_sync_stale_recovery_minutes: 60

# Alerting
slack_webhook_url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"

# ClickHouse memory overcommit alert thresholds
clickhouse_memory_alert_threshold_pct: 80 # % of max_server_memory_usage to trigger alert
clickhouse_memory_alert_consecutive_checks: 3 # checks × 3 min = 7–9 min sustained before first alert
clickhouse_memory_alert_cooldown_checks: 10 # re-alert every 10 checks (30 min) while still elevated

# Exchange API credentials — read from the controller's environment (see .env.example)
binance_api_key: "{{ lookup('env', 'BINANCE_API_KEY') }}"
binance_api_secret: "{{ lookup('env', 'BINANCE_API_SECRET') }}"
bybit_api_key: "{{ lookup('env', 'BYBIT_API_KEY') }}"
bybit_api_secret: "{{ lookup('env', 'BYBIT_API_SECRET') }}"
okx_api_key: "{{ lookup('env', 'OKX_API_KEY') }}"
okx_api_secret: "{{ lookup('env', 'OKX_API_SECRET') }}"
okx_api_passphrase: "{{ lookup('env', 'OKX_API_PASSPHRASE') }}"
bitget_api_key: "{{ lookup('env', 'BITGET_API_KEY') }}"
bitget_api_secret: "{{ lookup('env', 'BITGET_API_SECRET') }}"
bitget_api_passphrase: "{{ lookup('env', 'BITGET_API_PASSPHRASE') }}"
gateio_api_key: "{{ lookup('env', 'GATEIO_API_KEY') }}"
gateio_api_secret: "{{ lookup('env', 'GATEIO_API_SECRET') }}"
kucoin_api_key: "{{ lookup('env', 'KUCOIN_API_KEY') }}"
kucoin_api_secret: "{{ lookup('env', 'KUCOIN_API_SECRET') }}"
kucoin_api_passphrase: "{{ lookup('env', 'KUCOIN_API_PASSPHRASE') }}"

# Execution engine deployment
execution_engine_enabled: false # set true to activate; defaults live
execution_mode: live # dry-run or live (matches config filename suffix)
execution_config_dir: '{{ app_dir }}/config'
execution_wal_dir: /data/execution
execution_base_dir: '{{ app_dir }}/execution'
execution_releases_dir: '{{ app_dir }}/execution/releases'
execution_secrets_dir: '{{ app_dir }}/execution/secrets'
execution_releases_keep: 3
execution_image_tag: ''
execution_health_port: 9466
execution_health_ready_retries: 60
execution_health_ready_delay: 5

# Observability stack
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') }}"
prometheus_retention_days: 30
prometheus_image: prom/prometheus:v2.54.0
alertmanager_image: prom/alertmanager:v0.27.0
grafana_image: grafana/grafana:11.1.0
jaeger_image: jaegertracing/all-in-one:1.60

# Log shipping
loki_image: grafana/loki:3.0.0
promtail_image: grafana/promtail:3.0.0
loki_retention_hours: 336 # 14 days

# Postgres backup remote upload (rsync destination; leave empty to skip)
postgres_backup_remote_target: ''

# Public reverse proxy (Caddy) for observability dashboards
caddy_image: caddy:2.8-alpine
observability_public_host: "{{ lookup('env', 'OBSERVABILITY_PUBLIC_HOST') }}"  # e.g. 203-0-113-10.nip.io
observability_acme_email: "{{ lookup('env', 'OBSERVABILITY_ACME_EMAIL') }}"
observability_basicauth_user: 'ops'
# Generated via: caddy hash-password --plaintext "$GRAFANA_ADMIN_PASSWORD"
observability_basicauth_password_hash: "{{ lookup('env', 'OBSERVABILITY_BASICAUTH_PASSWORD_HASH') }}"
