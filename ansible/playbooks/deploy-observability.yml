---
- name: Deploy observability stack (Caddy + supporting services)
  hosts: servers
  become: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Assert required secrets are set
      ansible.builtin.include_tasks: ../tasks/assert-required-secrets.yml
      vars:
        required_secrets: [grafana_admin_password]

    - name: Template docker-compose.prod.yml
      ansible.builtin.template:
        src: ../roles/app/templates/docker-compose.prod.yml.j2
        dest: '{{ docker_compose_file }}'
        owner: nicolas
        group: nicolas
        mode: '0644'

    - name: Deploy observability stack
      ansible.builtin.include_role:
        name: observability
