---
- name: Full server provisioning
  hosts: servers
  become: true
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Ensure persistent quote validation reports directory exists
      ansible.builtin.file:
        path: "{{ quotes_validation_reports_dir }}"
        state: directory
        owner: nicolas
        group: nicolas
        mode: "0755"

  roles:
    - base
    - docker
    - hardening
    - app
    - postgres
    - workers
    - monitoring
    - observability
    - log-shipping
    - execution-engine
