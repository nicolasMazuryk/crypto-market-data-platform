---
- name: Full server provisioning
  hosts: servers
  become: true
  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: Assert required secrets are set
      ansible.builtin.include_tasks: ../tasks/assert-required-secrets.yml
      vars:
        required_secrets: [postgres_password, clickhouse_password, grafana_admin_password]

    - name: Ensure persistent quote validation reports directory exists
      ansible.builtin.file:
        path: '{{ quotes_validation_reports_dir }}'
        state: directory
        owner: nicolas
        group: nicolas
        mode: '0755'

  roles:
    - base
    - docker
    - hardening
    - app
    - postgres
    - workers
    - monitoring
    - role: observability
      when: enable_observability | default(false)
    - role: log-shipping
      when: enable_observability | default(false)
    - role: execution-engine
      when: execution_engine_enabled | default(false)
