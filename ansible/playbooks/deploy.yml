---
- name: Deploy latest code
  hosts: servers
  become: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    # ── Safety: block in-hours deploys unless explicitly acknowledged ─────────
    - name: Check if execution engine is running (live mode)
      ansible.builtin.command:
        cmd: systemctl is-active execution-engine@live.service
      register: _live_active
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Fail if deploying while live engine is running without acknowledgement
      ansible.builtin.fail:
        msg: >
          STOP: execution-engine@live.service is currently active.
          Deploying now will interrupt live trading.
          To proceed during trading hours, re-run with: -e allow_in_hours_deploy=true
          Record the rollback SHA first: ssh server "cat /opt/arbinet/execution/current/release"
      when:
        - _live_active.rc == 0
        - not (allow_in_hours_deploy | default(false) | bool)

    # ── Pre-deploy: stop execution engine before touching infra ───────────────
    - name: Stop execution engine gracefully before deploy
      ansible.builtin.include_role:
        name: execution-engine
        tasks_from: stop

    - name: Ensure persistent quote validation reports directory exists
      ansible.builtin.file:
        path: '{{ quotes_validation_reports_dir }}'
        state: directory
        owner: nicolas
        group: nicolas
        mode: '0755'

    - name: Pull latest code
      ansible.builtin.git:
        repo: '{{ repo_url }}'
        dest: '{{ repo_dir }}'
        version: '{{ repo_branch }}'
        accept_hostkey: true
        key_file: /home/nicolas/.ssh/github_deploy_key
        force: true
      become_user: nicolas

    - name: Build Docker image
      community.docker.docker_image:
        name: '{{ app_name }}'
        tag: latest
        source: build
        build:
          path: '{{ repo_dir }}'
        force_source: true

    - name: Template docker-compose.prod.yml
      ansible.builtin.template:
        src: ../roles/app/templates/docker-compose.prod.yml.j2
        dest: '{{ docker_compose_file }}'
        owner: nicolas
        group: nicolas
        mode: '0644'

    - name: Template .env
      ansible.builtin.template:
        src: ../roles/app/templates/env.prod.j2
        dest: '{{ app_dir }}/.env'
        owner: nicolas
        group: nicolas
        mode: '0600'

    # ── Infrastructure restart (safe: execution engine is stopped above) ──────
    - name: Restart ClickHouse
      ansible.builtin.command:
        cmd: docker compose -f {{ docker_compose_file }} up -d clickhouse
      changed_when: true

    - name: Wait for ClickHouse to be healthy
      ansible.builtin.uri:
        url: 'http://localhost:{{ clickhouse_http_port }}/ping'
        return_content: true
      register: healthcheck
      until: healthcheck.status == 200
      retries: 30
      delay: 2

    - name: Restart Postgres
      ansible.builtin.command:
        cmd: docker compose -f {{ docker_compose_file }} up -d postgres
      changed_when: true

    - name: Wait for Postgres to be healthy
      ansible.builtin.command:
        cmd: >
          docker exec arbinet-postgres
          pg_isready -U {{ postgres_user | default('arbinet') }} -d {{ postgres_db | default('arbinet') }}
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    # ── Observability + log-shipping configs ──────────────────────────────────
    - name: Deploy observability stack
      ansible.builtin.include_role:
        name: observability

    - name: Deploy log-shipping stack
      ansible.builtin.include_role:
        name: log-shipping

    # ── Execution engine: restart if was running or deploy_execution=true ─────
    - name: Deploy execution engine
      ansible.builtin.include_role:
        name: execution-engine
      when: execution_engine_enabled | default(false) | bool or deploy_execution | default(false) | bool
