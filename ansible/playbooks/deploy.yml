---
- name: Deploy latest code
  hosts: servers
  become: true
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Pull latest code
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        version: "{{ repo_branch }}"
        accept_hostkey: true
        key_file: /home/nicolas/.ssh/github_deploy_key
        force: true
      become_user: nicolas

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ app_name }}"
        tag: latest
        source: build
        build:
          path: "{{ repo_dir }}"
        force_source: true

    - name: Template docker-compose.prod.yml
      ansible.builtin.template:
        src: ../roles/app/templates/docker-compose.prod.yml.j2
        dest: "{{ docker_compose_file }}"
        owner: nicolas
        group: nicolas
        mode: "0644"

    - name: Template .env
      ansible.builtin.template:
        src: ../roles/app/templates/env.prod.j2
        dest: "{{ app_dir }}/.env"
        owner: nicolas
        group: nicolas
        mode: "0600"

    - name: Restart ClickHouse
      ansible.builtin.command:
        cmd: docker compose -f {{ docker_compose_file }} up -d clickhouse
      changed_when: true

    - name: Wait for ClickHouse to be healthy
      ansible.builtin.uri:
        url: "http://localhost:{{ clickhouse_http_port }}/ping"
        return_content: true
      register: healthcheck
      until: healthcheck.status == 200
      retries: 30
      delay: 2
