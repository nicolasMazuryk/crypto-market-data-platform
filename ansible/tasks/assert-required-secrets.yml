---
# lookup('env', ...) in group_vars returns '' for unset variables, so fail
# fast instead of provisioning services with empty passwords.
- name: Assert required secrets are set in the controller environment
  ansible.builtin.assert:
    that:
      - lookup('vars', item) | length > 0
    fail_msg: '{{ item }} is empty; export {{ item | upper }} before running this playbook'
    quiet: true
  loop: '{{ required_secrets }}'
