---
- name: Check if execution-engine service is active
  ansible.builtin.command:
    cmd: systemctl is-active execution-engine@{{ execution_mode }}.service
  register: _engine_active
  failed_when: false
  changed_when: false
  check_mode: false

- name: Stop execution-engine gracefully via systemd (SIGTERM + 30s drain)
  ansible.builtin.systemd:
    name: "execution-engine@{{ execution_mode }}.service"
    state: stopped
  when: _engine_active.rc == 0
  failed_when: false
