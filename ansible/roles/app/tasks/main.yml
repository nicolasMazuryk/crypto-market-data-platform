---
- name: Sync repository contents to server
  ansible.builtin.command:
    argv:
      - rsync
      - -az
      - --delete
      - --exclude=.context
      - --exclude=.git
      - --exclude=node_modules
      - --exclude=coverage
      - --exclude=dist
      - --exclude=.env
      - --exclude=.env.*
      - --exclude=terraform/.terraform
      - --exclude=terraform/*.tfstate
      - --exclude=terraform/*.tfstate.backup
      - --exclude=ansible/inventory/hosts.ini
      - -e
      - ssh -i ~/.ssh/nicolas -o StrictHostKeyChecking=no
      - "{{ playbook_dir }}/../../"
      - "nicolas@{{ ansible_host }}:{{ repo_dir }}/"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Ensure application SSH directory exists
  ansible.builtin.file:
    path: /home/nicolas/.ssh
    state: directory
    owner: nicolas
    group: nicolas
    mode: "0700"

- name: Generate GitHub deploy key for future remote pulls
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - arbinet-deploy
      - -f
      - /home/nicolas/.ssh/github_deploy_key
  args:
    creates: /home/nicolas/.ssh/github_deploy_key
  become_user: nicolas

- name: Ensure ClickHouse config directory exists
  ansible.builtin.file:
    path: /opt/arbinet/clickhouse-config
    state: directory
    owner: nicolas
    group: nicolas
    mode: "0755"

- name: Deploy ClickHouse system log TTL config
  ansible.builtin.template:
    src: clickhouse-system-logs.xml.j2
    dest: /opt/arbinet/clickhouse-config/system-logs.xml
    owner: nicolas
    group: nicolas
    mode: "0644"

- name: Deploy ClickHouse network bind config
  ansible.builtin.template:
    src: clickhouse-network.xml.j2
    dest: /opt/arbinet/clickhouse-config/network.xml
    owner: nicolas
    group: nicolas
    mode: "0644"

- name: Template docker-compose.prod.yml
  ansible.builtin.template:
    src: docker-compose.prod.yml.j2
    dest: "{{ docker_compose_file }}"
    owner: nicolas
    group: nicolas
    mode: "0644"

- name: Template production environment file
  ansible.builtin.template:
    src: env.prod.j2
    dest: "{{ app_dir }}/.env"
    owner: nicolas
    group: nicolas
    mode: "0600"

- name: Build application image
  ansible.builtin.command:
    cmd: docker build -t {{ app_name }}:latest {{ repo_dir }}
  changed_when: true

- name: Start ClickHouse
  ansible.builtin.command:
    cmd: docker compose -f {{ docker_compose_file }} up -d clickhouse
  changed_when: true

- name: Wait for ClickHouse to become healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ clickhouse_http_port }}/ping"
    return_content: true
  register: clickhouse_healthcheck
  until: clickhouse_healthcheck.status == 200
  retries: 30
  delay: 2
