apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts
        type: slack
        settings:
          url: '${SLACK_WEBHOOK_URL}'
          channel: '#alerts'
          username: arbinet-grafana
          icon_emoji: ':fire:'
          title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Summary:* {{ .Annotations.summary }}
            *Detail:* {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false
