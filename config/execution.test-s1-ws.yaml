# Test config: strategy_1_ws — WS-driven entry/exit on funding-fee event
# Run:  tsx src/execution/scripts/live-strategy-1-ws.ts --config config/execution.test-s1-ws.yaml
# Start ~30 min before any hourly boundary (HH:00:00 UTC) so the scheduler catches 1h-interval symbols.
mode: live

# Bybit disabled: live engine (strategy_3a) uses same API keys and flattens test positions as orphans.
exchanges:
  - exchange: binance
    enabled: true
    credentialsEnvPrefix: BINANCE
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

  - exchange: bybit
    enabled: false
    credentialsEnvPrefix: BYBIT
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

  - exchange: okx
    enabled: true
    credentialsEnvPrefix: OKX
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

  - exchange: bitget
    enabled: true
    credentialsEnvPrefix: BITGET
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

  - exchange: gateio
    enabled: true
    credentialsEnvPrefix: GATEIO
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

  - exchange: kucoin
    enabled: true
    credentialsEnvPrefix: KUCOIN
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []

strategies:
  - id: strategy_1_ws
    enabled: true
    negativeFundingThresholdPercent: -0.02   # -0.02% — broad enough to surface many test candidates
    entryOffsetSeconds: 10                   # submit entry 10 s before nextFundingTimestamp
    fundingFeeTimeoutSeconds: 60             # extended: testing if WS fee events arrive in time
    amountUsd: 20                            # $20 per order (~$80 notional at 4× leverage)
    leverage: 4

risk:
  globalMaxConcurrentIntents: 5             # cap at one intent per enabled exchange
  globalMaxNotionalUsd: 130                 # 5 × $20 + headroom
  perStrategy:
    strategy_1_ws:
      maxConcurrentIntents: 5
      maxNotionalUsd: 130

scheduler:
  fundingWindowMs: 2100000                  # 35 min — catches 1h-interval symbols due within 35 min
  wakeBeforeHourEndMs: 2100000              # scheduler wakes 35 min before each hourly boundary
