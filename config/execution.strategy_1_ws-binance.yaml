mode: live
exchanges:
  - exchange: binance
    enabled: true
    credentialsEnvPrefix: BINANCE
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []
strategies:
  - id: strategy_1_ws
    enabled: true
    negativeFundingThresholdPercent: -0.1
    entryOffsetSeconds: 3
    fundingFeeTimeoutSeconds: 10
    amountUsd: 10
    leverage: 5
observability:
  metricsPort: 9501
  healthPort: 9601
risk:
  globalMaxConcurrentIntents: 200
  globalMaxNotionalUsd: 50000
