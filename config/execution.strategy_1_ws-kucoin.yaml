    enabled: true
    credentialsEnvPrefix: KUCOIN
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []
strategies:
