    enabled: true
    negativeFundingThresholdPercent: -0.1
    entryOffsetSeconds: 3
    fundingFeeTimeoutSeconds: 10
    amountUsd: 10
    leverage: 5
observability:
  metricsPort: 9521
  healthPort: 9621
risk:
  globalMaxConcurrentIntents: 200
  globalMaxNotionalUsd: 50000
