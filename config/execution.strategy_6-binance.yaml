mode: live
exchanges:
  - exchange: binance
    enabled: true
    credentialsEnvPrefix: BINANCE
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets:
        - endpointClass: order_write
          tokensPerSecond: 6
          burst: 12
        - endpointClass: account_write
          tokensPerSecond: 3
          burst: 6
        - endpointClass: order_read
          tokensPerSecond: 6
          burst: 12
        - endpointClass: account_read
          tokensPerSecond: 3
          burst: 6
strategies:
  - id: strategy_6
    enabled: true
    mainSide: long
    funding_threshold: 0.1
    entryOffsetSeconds: 3
    fundingFeeTimeoutSeconds: 10
    tpMultiplier: 1.5
    slMultiplier: 1.5
    deadlineSeconds: 1800
    mainAmountUsd: 10
    leverage: 5
observability:
  metricsPort: 9504
  healthPort: 9604
risk:
  globalMaxConcurrentIntents: 200
  globalMaxNotionalUsd: 50000
