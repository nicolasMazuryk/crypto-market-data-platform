# Test config: strategy_4_1a (ladder limit entry + sl_tp_deadline)
# Run: tsx src/execution/index.ts --config config/execution.test-s41a.yaml --exchange bybit --funding HH:MM:SS --ack-live-funding-override
mode: live

strategies:
  - id: strategy_4_1a
    enabled: true
    negativeFundingThresholdPercent: -0.01   # very permissive
    entryOffsetSeconds: 5
    ladderCount: 3
    ladderTopMult: 0.05                       # topOffset = 0.05 × |F%| → tiny, near market
    ladderBottomMult: 0.20                    # bottomOffset = 0.20 × |F%| (> topMult ✓)
    takeProfitPct: 0.3
    deadlineSeconds: 180
    slMultiplier: 3.0                         # wide SL to survive noise
    amountUsd: 20
    leverage: 4

risk:
  globalMaxConcurrentIntents: 1
  globalMaxNotionalUsd: 50
  perStrategy:
    strategy_4_1a:
      maxConcurrentIntents: 1
      maxNotionalUsd: 50

testing:
  fundingTimeOverride:
    acknowledgeLiveOverride: true
