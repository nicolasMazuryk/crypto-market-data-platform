# Base configuration for all backtesting strategies
# Strategy-specific configs are deep-merged on top of this

exchange: "binance"
# symbol: "HANAUSDT"  # Omit to run for all symbols on the exchange
start_date: "2025-01-01 00:00:00"
end_date: "2026-04-14 00:00:00"

fees:
  binance:
    taker_fee: 0.0005   # 0.05%
    maker_fee: 0.0002   # 0.02%
  binanceusdm:
    taker_fee: 0.0005   # 0.05%
    maker_fee: 0.0002   # 0.02%
  bybit:
    taker_fee: 0.001    # 0.10%
    maker_fee: 0.00036  # 0.036%
  okx:
    taker_fee: 0.0005   # 0.05%
    maker_fee: 0.0002   # 0.02%
  mexc:
    taker_fee: 0.0004   # 0.04%
    maker_fee: 0.0001   # 0.01%
  bitget:
    taker_fee: 0.001    # 0.10%
    maker_fee: 0.00036  # 0.036%
  gateio:
    taker_fee: 0.0005   # 0.05%
    maker_fee: 0.0002   # 0.02%
  kucoinfutures:
    taker_fee: 0.0006   # 0.06%
    maker_fee: 0.0002   # 0.02%
  kucoin:
    taker_fee: 0.0006   # 0.06%
    maker_fee: 0.0002   # 0.02%

validation:
  required_seconds_before: 3
  required_seconds_after: 3
  max_gap_seconds: 3
  max_price_change_pct: 0.20  # 20%

window:
  pre_funding_seconds: 60
  post_funding_seconds: 120

slippage:
  stop_order_slippage: 0.0001  # 0.01%

reporting:
  include_trade_log: true
  output_dir: "reports"

funding_time_tolerance_seconds: 60  # Max seconds between exchanges' funding timestamps to be treated as the same event

# Spot exchange fee per order leg (market/taker rate).
# Used by strategy_spot_futures; standard strategies use the 'fees' map above.
funding_settlement:
  detection_window_seconds: 10
  tp_post_settlement_buffer_seconds: 1

spot_fees:
  binance:       {fee: 0.001}   # 0.10%
  binanceusdm:   {fee: 0.001}
  bybit:         {fee: 0.001}   # 0.10%
  okx:           {fee: 0.001}   # 0.10%
  mexc:          {fee: 0.001}
  bitget:        {fee: 0.001}   # 0.10%
  gateio:        {fee: 0.001}   # 0.10%
  kucoinfutures: {fee: 0.001}
  kucoin:        {fee: 0.001}   # 0.10%
