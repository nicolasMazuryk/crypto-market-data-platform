# Strategy 4.2a: Single Limit LONG - No Funding Applied

strategy_id: "strategy_4_2a"
direction: "long"
funding_threshold: 0.004      # 0.4%
entry_offset_seconds: 2       # Setup at T_funding - 2s
limit_offset_mult: 1.0        # Limit at P * (1 - F * 1.0)
take_profit: 0.002            # 0.2%
deadline_seconds: 600         # Max hold after T_funding (10 minutes)
funding_applied_on_same_second: false
sl_mult: 1.5                  # SL at entry × (1 − F × 1.5); must be > limit_offset_mult
