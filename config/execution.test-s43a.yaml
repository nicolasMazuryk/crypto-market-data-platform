# Test config: strategy_4_3a (limit entry via entryMult + sl_tp_deadline)
# Run: tsx src/execution/index.ts --config config/execution.test-s43a.yaml --exchange bybit --funding HH:MM:SS --ack-live-funding-override
mode: live

strategies:
  - id: strategy_4_3a
    enabled: true
    negativeFundingThresholdPercent: -0.01   # very permissive
    entryOffsetSeconds: 5
    entryMult: 0.1                            # tiny offset: 0.1 × |F%| → limit ~near market
    takeProfitPct: 0.3
    deadlineSeconds: 180
    slMultiplier: 3.0
    amountUsd: 20
    leverage: 4

risk:
  globalMaxConcurrentIntents: 1
  globalMaxNotionalUsd: 50
  perStrategy:
    strategy_4_3a:
      maxConcurrentIntents: 1
      maxNotionalUsd: 50

testing:
  fundingTimeOverride:
    acknowledgeLiveOverride: true
