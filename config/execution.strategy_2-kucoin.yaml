mode: live
exchanges:
  - exchange: kucoin
    enabled: true
    credentialsEnvPrefix: KUCOIN
    marketRefreshMs: 60000
    fundingPullMs: 10000
    rateLimits:
      criticalReservationFraction: 0.1
      criticalWindowSeconds: 60
      buckets: []
observability:
  metricsPort: 9522
  healthPort: 9622
risk:
  globalMaxConcurrentIntents: 200
  globalMaxNotionalUsd: 50000
