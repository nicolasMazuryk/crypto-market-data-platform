# Test config: strategy_2 (market entry + sl_tp_deadline_retracement_funding_event)
# ALL EXCHANGES — real $20 orders
#
# Run (natural 1h funding, no override):
#   tsx src/execution/index.ts --config config/execution.test-s2.yaml
#
# Run (funding override — e.g. 9 min from now):
#   tsx src/execution/index.ts --config config/execution.test-s2.yaml \
#     --funding HH:MM:SS --ack-live-funding-override
#
# Single-exchange run (avoids cap contention; test one exchange at a time):
#   ... --exchange okx
#   ... --exchange bitget
#   ... --exchange kucoin
#   ... --exchange binance
mode: live

strategies:
  - id: strategy_2
    enabled: true
    negativeFundingThresholdPercent: -0.000001  # fires when rate ≤ -0.000001% — catches any negative rate
    entryOffsetSeconds: 5
    retracementPct: 0.5
    deadlineSeconds: 180                      # 3 min deadline after T_funding
    slMultiplier: 3.0                         # wide SL to survive noise
    fundingFeeTimeoutSeconds: 8              # WS gate fallback: arm tracker 8s after T_funding if no fee event
    amountUsd: 20
    leverage: 4

risk:
  globalMaxConcurrentIntents: 6             # 1 per exchange × 6 exchanges
  globalMaxNotionalUsd: 200
  perStrategy:
    strategy_2:
      maxConcurrentIntents: 6
      maxNotionalUsd: 200

scheduler:
  fundingWindowMs: 3600000    # 60 min — covers 4h and 8h cycles with margin

testing:
  fundingTimeOverride:
    acknowledgeLiveOverride: true
